<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Instantâneo</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>


<dialog id="meuPopUp">
    <div class="tittle">
        <h2>Seja Bem-vindo!</h2>
    </div>

    <div class="modal-body">
        <label for="username">Antes de entrar, defina seu nome</label>

        <input type="text" id="username" placeholder="Seu nome..."
            maxlength="20" style="display: block; margin: 0 auto; text-align: center;">

        <button id="fecharModal" class="btn-primario">Entrar</button>
        
        <p>ou</p>
        
        <button id="entrarAnonimo" class="btn-secundario">Entrar como anônimo</button>

    </div>
</dialog>








    <header>
        <div class="room-info">
            <span id="status-dot" class="dot offline"></span>
            <span id="status-text">Conectando sala...</span>
        </div>
        <div class="header-actions">
            <input type="text" id="username" placeholder="Seu apelido" maxlength="20">
            <button id="copy-link-btn" class="btn-header">Copiar Link da Sala</button>
            <button id="new-room-btn" class="btn-header">Nova Sala</button>
        </div>
    </header>
    <!-- link do iisntagram -->
    <div class="dev-credit">
        feito por <a href="https://www.instagram.com/gusta_d.p/" target="_blank"
            rel="noopener noreferrer">@gusta_d.p</a>
    </div>


    <!-- ÁREA ONDE AS MENSAGENS APARECEM -->
    <main id="messages"></main>

    <!-- ÁREA ONDE VOCÊ ESCREVE -->
    <footer>
        <div class="input-box">
            <input type="text" id="msg-input" placeholder="Escreva sua mensagem aqui e aperte Enter..."
                autocomplete="off">
            <button id="send-btn">Enviar</button>
        </div>
    </footer>

    <script type="module" src="script2.js"></script>
</body>

</html>
